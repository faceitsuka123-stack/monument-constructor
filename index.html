<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        #sidebar-controls {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
            max-height: 650px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        .screenshot-btn {
            background-color: #0288d1;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
            margin-top: 10px;
        }
        .order-btn {
            background-color: #e65100;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
            display: block;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(230,81,0,0.3);
            transition: background 0.2s;
        }
        .order-btn:hover {
            background-color: #ef6c00;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
    <!-- Подключение Three.js и OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<h1>Онлайн-примерка гравировки на памятник (3D)</h1>

<div id="main-container">
    <div id="monument-preview-box"></div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Материал и геометрия</span>
            <label>Тип камня</label>
            <select id="material-selector">
                <option value="gabbro">Габбро-диабаз (Глубокий черный)</option>
                <option value="dymov">Дымовский (Красно-коричневый)</option>
                <option value="pokost">Покостовский (Светло-серый гранит)</option>
            </select>
            
            <label style="margin-top: 5px;">Форма плиты</label>
            <select id="shape-selector">
                <option value="arc">Арка (скругленная сверху)</option>
                <option value="rect">Прямоугольник (строгий)</option>
                <option value="angel">Ангел (фигурный силуэт)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">2. Фотография (Лицевая сторона)</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">3. Выбор шрифта и декора</span>
            <label>Шрифт надписей</label>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="cursive, serif">Каллиграфический (Курсив)</option>
            </select>

            <label style="margin-top: 5px;">Цвет знаков (гравировки)</label>
            <select id="engraving-color-selector">
                <option value="white">Матовый белый (Скарпель)</option>
                <option value="gold">Сусальное золото</option>
            </select>

            <label style="margin-top: 5px;">Художественный декор</label>
            <select id="decor-selector">
                <option value="none">Без декора</option>
                <option value="cross">Православный крест (сверху)</option>
                <option value="branches">Ветви памяти (снизу)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">4. Гравировка (Лицевая сторона)</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="input-group">
            <span class="section-title">5. Гравировка (Обратная сторона)</span>
            <label>Текст / Эпитафия на обороте</label>
            <textarea id="text-back" placeholder="Помним, любим, скорбим"></textarea>
        </div>

        <button class="screenshot-btn" id="screenshot-btn">Скачать скриншот макета</button>
        <button class="order-btn" id="order-btn">Отправить заказ менеджеру</button>

        <div class="hint-box">
            🔄 Зажмите левую кнопку мыши для вращения на 360°. Используйте колесико мыши для приближения и отдаления.
        </div>
    </div>
</div>

<script>
    var fileInput = document.getElementById('file-input');
    var textFio = document.getElementById('text-fio');
    var textDates = document.getElementById('text-dates');
    var textBack = document.getElementById('text-back');
    var fontSelector = document.getElementById('font-selector');
    var shapeSelector = document.getElementById('shape-selector');
    var materialSelector = document.getElementById('material-selector');
    var engravingColorSelector = document.getElementById('engraving-color-selector');
    var decorSelector = document.getElementById('decor-selector');
    var screenshotBtn = document.getElementById('screenshot-btn');
    var orderBtn = document.getElementById('order-btn');
    var previewBox = document.getElementById('monument-preview-box');

    var loadedImage = null;
    var canvasTexture = null;
    var steleMesh = null;

    // Палитра камней (Цвет основы и цвет торцов/базы)
    var stoneColors = {
        gabbro: { base: '#151515', side: 0x181818 },
        dymov: { base: '#42241d', side: 0x3a1f19 },
        pokost: { base: '#7c8285', side: 0x6e7375 }
    };

    // Палитра гравировки
    var engravingColors = {
        white: { fill: '#dedede', shadow: '#000000', metalness: 0.1, roughness: 0.2 },
        gold: { fill: '#ffd700', shadow: '#4a3b00', metalness: 0.8, roughness: 0.1 }
    };

    // HD Текстурный холст (4096x2048) для идеальной четкости
    var textureCanvas = document.createElement('canvas');
    textureCanvas.width = 4096;
    textureCanvas.height = 2048;
    var ctx = textureCanvas.getContext('2d');

    function redrawTexture() {
        var currentShape = shapeSelector.value;
        var selectedFont = fontSelector.value;
        var currentStone = stoneColors[materialSelector.value];
        var currentEngraving = engravingColors[engravingColorSelector.value];
        var currentDecor = decorSelector.value;

        // Обновление физических свойств материала Three.js при смене цвета гравировки
        if (monumentMaterial) {
            monumentMaterial.metalness = currentEngraving.metalness;
            monumentMaterial.roughness = currentEngraving.roughness;
        }

        // 1. Очистка холста и заливка базовым цветом камня
        ctx.fillStyle = currentStone.base;
        ctx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);
        
        // Текстурная мелкозернистая крошка гранита (масштабировано под HD)
        ctx.fillStyle = materialSelector.value === 'pokost' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.03)';
        for (var i = 0; i < 8000; i++) {
            var x = Math.random() * textureCanvas.width;
            var y = Math.random() * textureCanvas.height;
            ctx.fillRect(x, y, 4, 4);
        }

        // --- ЛЕВАЯ ПОЛОВИНА: ЛИЦЕВАЯ СТОРОНА (X от 0 до 2048) ---
        // Смещение содержимого вправо для формы "Ангел" (в пикселях HD холста)
        var frontOffset = (currentShape === 'angel') ? 320 : 0;
        var centerXFront = 1024 + frontOffset;

        // Рисование портрета
        if (loadedImage) {
            ctx.save();
            var imgW = 680;
            var imgH = 880;
            var imgX = centerXFront - imgW / 2;
            var imgY = currentDecor === 'cross' ? 350 : 200; // Сдвигаем вниз, если сверху крест

            ctx.beginPath();
            ctx.ellipse(imgX + imgW/2, imgY + imgH/2, imgW/2, imgH/2, 0, 0, Math.PI * 2);
            ctx.clip();

            var imgRatio = loadedImage.width / loadedImage.height;
            var targetRatio = imgW / imgH;
            var srcX = 0, srcY = 0, srcW = loadedImage.width, srcH = loadedImage.height;

            if (imgRatio > targetRatio) {
                srcW = loadedImage.height * targetRatio;
                srcX = (loadedImage.width - srcW) / 2;
            } else {
                srcH = loadedImage.width / targetRatio;
                srcY = (loadedImage.height - srcH) / 2;
            }

            ctx.filter = 'grayscale(100%) contrast(150%) brightness(110%)';
            ctx.drawImage(loadedImage, srcX, srcY, srcW, srcH, imgX, imgY, imgW, imgH);
            ctx.filter = 'none';

            // Мягкое виньетирование краев фото
            var gradient = ctx.createRadialGradient(
                imgX + imgW/2, imgY + imgH/2, imgW * 0.28, 
                imgX + imgW/2, imgY + imgH/2, imgW * 0.5
            );
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(0.7, 'rgba(0,0,0,0.3)');
            gradient.addColorStop(1, currentStone.base);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(imgX, imgY, imgW, imgH);
            ctx.restore();
        }

        // Рендеринг декора на лицевой стороне
        ctx.fillStyle = currentEngraving.fill;
        ctx.strokeStyle = currentEngraving.fill;
        ctx.lineWidth = 6;
        ctx.textAlign = 'center';

        if (currentDecor === 'cross') {
            // Рисуем простой христианский крест вверху плиты
            var crossX = centerXFront;
            var crossY = 180;
            ctx.beginPath();
            // Вертикальная перекладина
            ctx.moveTo(crossX, crossY - 80); ctx.lineTo(crossX, crossY + 80);
            // Горизонтальная перекладина
            ctx.moveTo(crossX - 45, crossY - 20); ctx.lineTo(crossX + 45, crossY - 20);
            // Косая перекладина
            ctx.moveTo(crossX - 25, crossY + 45); ctx.lineTo(crossX + 25, crossY + 25);
            ctx.stroke();
        } else if (currentDecor === 'branches') {
            // Рисуем символические ветви памяти в самом низу
            var branchY = 1950;
            ctx.font = '40px ' + selectedFont;
            ctx.fillText('🌿 ═════════════ 🌿', centerXFront, branchY);
        }

        // Текст лицевой стороны
        ctx.fillStyle = currentEngraving.fill;
        ctx.shadowColor = currentEngraving.shadow;
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;

        ctx.font = 'bold 72px ' + selectedFont;
        var fioValue = textFio.value || "ИВАНОВ\nИВАН\nИВАНОВИЧ";
        var lines = fioValue.toUpperCase().split(/[\s\n]+/);
        var startY = loadedImage ? (currentDecor === 'cross' ? 1320 : 1200) : 750;
        
        for (var j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], centerXFront, startY + (j * 105));
        }

        ctx.font = 'bold 56px ' + selectedFont;
        var datesValue = textDates.value || "10.05.1950 — 22.11.2023";
        ctx.fillText(datesValue, centerXFront, startY + (lines.length * 105) + 50);

        // --- ПРАВАЯ ПОЛОВИНА: ОБРАТНАЯ СТОРОНА (X от 2048 до 4096) ---
        var backOffset = (currentShape === 'angel') ? -320 : 0;
        var centerXBack = 3072 + backOffset;

        ctx.font = 'italic 64px ' + selectedFont;
        var backValue = textBack.value || "Помним, любим, скорбим";
        var backLines = backValue.split('\n');
        var startYBack = 1000 - (backLines.length * 50);

        for (var k = 0; k < backLines.length; k++) {
            ctx.fillText(backLines[k], centerXBack, startYBack + (k * 100));
        }
        
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        if (canvasTexture) {
            canvasTexture.needsUpdate = true;
        }
    }

    // Инициализация Three.js сцены
    var scene = new THREE.Scene();
    
    var camera = new THREE.PerspectiveCamera(45, previewBox.clientWidth / previewBox.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.7, 4.6);

    var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(previewBox.clientWidth, previewBox.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Ограничение для оптимизации производительности
    renderer.shadowMap.enabled = true;
    previewBox.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.0;
    controls.target.set(0, 0, 0);

    // Освещение
    var ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    var dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight.position.set(5, 8, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    var pointLight = new THREE.PointLight(0xffffff, 0.3, 10);
    pointLight.position.set(-3, 3, 4);
    scene.add(pointLight);

    // Земля
    var floorGeo = new THREE.PlaneGeometry(12, 12);
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1d, roughness: 0.85 });
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Статичное общее основание (Цоколь)
    var baseGeo = new THREE.BoxGeometry(1.6, 0.2, 0.6);
    var baseMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.25, metalness: 0.1 });
    var baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.set(0, -0.9, 0);
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    scene.add(baseMesh);

    // Текстура и материалы
    canvasTexture = new THREE.CanvasTexture(textureCanvas);
    
    var monumentMaterial = new THREE.MeshStandardMaterial({
        map: canvasTexture,
        roughness: 0.2,
        metalness: 0.1
    });

    var sideMaterial = new THREE.MeshStandardMaterial({
        color: 0x181818,
        roughness: 0.25,
        metalness: 0.1
    });

    function rebuildMonumentGeometry() {
        if (steleMesh) scene.remove(steleMesh);

        // Обновление цвета торцов и постамента под выбранный камень
        var activeStone = stoneColors[materialSelector.value];
        sideMaterial.color.setHex(activeStone.side);
        baseMat.color.setHex(activeStone.side);

        var width = 1.1;
        var height = 1.6;
        var shape = new THREE.Shape();
        var currentShapeType = shapeSelector.value;

        if (currentShapeType === 'arc') {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, height/2 - width/2);
            shape.absarc(0, height/2 - width/2, width/2, Math.PI, 0, true);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        } else if (currentShapeType === 'angel') {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, -0.4);
            shape.quadraticCurveTo(-width/2 - 0.1, -0.1, -width/2 + 0.05, 0.2);
            shape.quadraticCurveTo(-width/2 - 0.2, 0.4, -width/3, 0.6);
            shape.quadraticCurveTo(-width/4, 0.7, -width/5, 0.75);
            shape.absarc(-width/8, 0.65, 0.12, Math.PI, 0, true);
            shape.quadraticCurveTo(0, 0.8, width/2, 0.8);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        } else {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, height/2);
            shape.lineTo(width/2, height/2);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        }

        var extrudeSettings = {
            depth: 0.12,
            bevelEnabled: true,
            bevelSegments: 4,
            steps: 1,
            bevelSize: 0.015,
            bevelThickness: 0.015
        };

        var steleGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        
        // Исправление искажения: используем строго фиксированные габариты плиты для UV развертки
        var refMinX = -0.55; 
        var refRangeX = 1.1;
        var refMinY = -0.8;
        var refRangeY = 1.6;
        
        var uvAttribute = steleGeo.attributes.uv;
        var posAttribute = steleGeo.attributes.position;

        for (var i = 0; i < uvAttribute.count; i++) {
            var posX = posAttribute.getX(i);
            var posY = posAttribute.getY(i);
            var posZ = posAttribute.getZ(i);
            
            if (posZ > 0.11) {
                // Лицевая сторона: проецируем строго в левую часть текстуры (0.0 -> 0.5) без деформаций
                var uFront = (posX - refMinX) / refRangeX * 0.5;
                var vFront = (posY - refMinY) / refRangeY;
                uvAttribute.setXY(i, uFront, vFront);
            } else if (posZ < 0.01) {
                // Обратная сторона: в правую часть текстуры (0.5 -> 1.0) с зеркальным разворотом
                var uBack = 0.5 + (1.0 - (posX - refMinX) / refRangeX) * 0.5;
                var vBack = (posY - refMinY) / refRangeY;
                uvAttribute.setXY(i, uBack, vBack);
            } else {
                uvAttribute.setXY(i, 0, 0);
            }
        }
        uvAttribute.needsUpdate = true;
        steleGeo.center();

        steleMesh = new THREE.Mesh(steleGeo, [monumentMaterial, sideMaterial]);
        steleMesh.position.set(0, 0, 0);
        steleMesh.castShadow = true;
        steleMesh.receiveShadow = true;
        scene.add(steleMesh);
    }

    // Назначение обработчиков событий интерактивным элементам управления
    shapeSelector.onchange = function() {
        rebuildMonumentGeometry();
        redrawTexture();
    };
    materialSelector.onchange = function() {
        rebuildMonumentGeometry();
        redrawTexture();
    };
    engravingColorSelector.onchange = redrawTexture;
    decorSelector.onchange = redrawTexture;
    textFio.oninput = redrawTexture;
    textDates.oninput = redrawTexture;
    textBack.oninput = redrawTexture;
    fontSelector.onchange = redrawTexture;

    // Первичный запуск сборки геометрии и генерации текстуры
    rebuildMonumentGeometry();
    redrawTexture();

    // Загрузка фото портрета через FileReader
    fileInput.onchange = function(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                loadedImage = img;
                redrawTexture();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(files[0]);
    };

    // Экспорт скриншота
    screenshotBtn.onclick = function() {
        renderer.render(scene, camera);
        var dataURL = renderer.domElement.toDataURL('image/png');
        var link = document.createElement('a');
        link.download = 'monument_3d_design.png';
        link.href = dataURL;
        link.click();
    };

    // Имитация отправки оформленного заказа в CRM или бэкенд
    orderBtn.onclick = function() {
        var orderData = {
            stoneType: materialSelector.value,
            shape: shapeSelector.value,
            font: fontSelector.value,
            engravingColor: engravingColorSelector.value,
            decor: decorSelector.value,
            fio: textFio.value || "Иванов Иван Иванович",
            dates: textDates.value || "10.05.1950 — 22.11.2023",
            backText: textBack.value || "Помним, любим, скорбим"
        };
        
        alert("Заказ успешно сформирован!\n\nДанные отправленные на сервер:\n" + JSON.stringify(orderData, null, 2) + "\n\nМенеджер свяжется с вами.");
        console.log("Данные заказа:", orderData);
    };

    // Анимационный цикл рендеринга Three.js сцены
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // Оптимизированный адаптивный ресайз холста с помощью ResizeObserver
    var resizeTimeout;
    const resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                var width = entry.contentRect.width;
                var height = entry.contentRect.height;
                if(width && height) {
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);
                }
            }, 100);
        }
    });
    resizeObserver.observe(previewBox);
</script>
