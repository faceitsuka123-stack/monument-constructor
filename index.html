<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1250px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #sidebar-controls {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            font-weight: bold;
        }
    </style>
    <!-- Подключаем 3D-библиотеки через сверхнадежные и быстрые серверы Яндекса -->
    <script src="https://yastatic.net"></script>
</head>
<body>

<h1>Онлайн 3D-примерка гравировки на памятник</h1>

<div id="main-container">
    <div id="monument-preview-box">
        <div id="canvas-container"></div>
    </div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">2. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="hint-box">
            🔄 Зажмите мышку внутри черного окна и двигайте её, чтобы вращать памятник в 3D со всех сторон!
        </div>
    </div>
</div>

<script>
    var container = document.getElementById('canvas-container');
    var wrapper = document.getElementById('monument-preview-box');
    
    var inputFio = "";
    var inputDates = "";
    var userImage = null;

    // 1. Создание 3D сцены
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    // Камера
    var camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
    camera.position.set(0, 2.3, 5.5);

    // Рендерер
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Вращение мыши ручным надежным способом без внешних скриптов управления
    var theta = 0.4;
    var phi = 0.2;
    var isDragging = false;
    var prevMouseX = 0;
    var prevMouseY = 0;

    wrapper.addEventListener('mousedown', function(e) {
        isDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
    });

    window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        var deltaX = e.clientX - prevMouseX;
        var deltaY = e.clientY - prevMouseY;

        theta -= deltaX * 0.01;
        phi += deltaY * 0.01;
        phi = Math.max(-0.3, Math.min(0.5, phi)); // Блокировка переворота камеры

        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', function() { isDragging = false; });

    // Освещение сцены
    var ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    var dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Земля (Сетка плитки)
    var floorGeo = new THREE.PlaneGeometry(20, 20);
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Виртуальный 2D холст для создания лица памятника
    var textureCanvas = document.createElement('canvas');
    var tCtx = textureCanvas.getContext('2d');
    textureCanvas.width = 512;
    textureCanvas.height = 512;

    var steleTexture = new THREE.Texture(textureCanvas);

    // Материал полированного черного гранита
    var graniteMaterial = new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.15,
        metalness: 0.1
    });

    // Материал лицевой стороны стелы с текстурой
    var faceMaterial = new THREE.MeshStandardMaterial({
        map: steleTexture,
        roughness: 0.15
    });

    // Назначаем материалы граням 3D куба [право, лево, верх, низ, лицо, зад]
    var steleMaterials = [
        graniteMaterial, graniteMaterial, graniteMaterial, graniteMaterial, faceMaterial, graniteMaterial
    ];

    // Геометрия 3D Стелы (Плиты)
    var steleGeo = new THREE.BoxGeometry(1.2, 2.0, 0.25);
    var stele = new THREE.Mesh(steleGeo, steleMaterials);
    stele.position.y = 1.2;
    scene.add(stele);

    // Подставка под стелу (Тумба)
    var baseGeo = new THREE.BoxGeometry(1.6, 0.2, 0.5);
    var base = new THREE.Mesh(baseGeo, graniteMaterial);
    base.position.y = 0.1;
    scene.add(base);

    // Обновление портрета и текста на памятнике
    function updateMonumentTexture() {
        tCtx.fillStyle = "#1c1c1c";
        tCtx.fillRect(0, 0, 512, 512);

        // Нанесение полированной фаски по контуру текстуры
        tCtx.strokeStyle = "rgba(255,255,255,0.08)";
        tCtx.lineWidth = 4;
        tCtx.strokeRect(2, 2, 508, 508);

        // Отрисовка портрета сверху
        if (userImage) {
            var aspect = userImage.width / userImage.height;
            var w = 220; var h = w / aspect;
            if (h > 250) { h = 240; w = h * aspect; }
            var x = (512 - w) / 2; var y = 45;

            var tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            var tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(userImage, 0, 0, w, h);

            // Фильтр гравировки станка
            var imgData = tempCtx.getImageData(0, 0, w, h);
            var data = imgData.data;
            for (var i = 0; i < data.length; i += 4) {
                var b = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                b = b > 120 ? Math.min(255, b * 1.35) : Math.max(35, b * 0.35);
                data[i] = b; data[i + 1] = b; data[i + 2] = b;
            }
            tempCtx.putImageData(imgData, 0, 0);

            // Овальная растушевка
            tCtx.save();
            tCtx.beginPath(); tCtx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2); tCtx.clip();
            tCtx.drawImage(tempCanvas, x, y);
            tCtx.restore();

            tCtx.strokeStyle = "rgba(255,255,255,0.15)";
            tCtx.lineWidth = 1;
            tCtx.beginPath(); tCtx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2); tCtx.stroke();
        }

        // Отрисовка ФИО и Дат строго внизу
        tCtx.fillStyle = "#dedede";
        tCtx.textAlign = "center";
        tCtx.font = "bold 23px 'Times New Roman', Georgia, serif";

        var lines = inputFio.toUpperCase().split(" ");
        var startY = 340;
        lines.forEach(function(line, index) {
            var spacedLine = line.split("").join(" ");
            tCtx.fillText(spacedLine, 256, startY + (index * 28));
        });

        tCtx.font = "bold 16px 'Times New Roman', Georgia, serif";
        tCtx.fillStyle = "#b8b8b8";
        tCtx.fillText(inputDates, 256, 465);

        steleTexture.needsUpdate = true;
    }

    // Слушатели событий интерфейса
    document.getElementById('file-input').onchange = function(e) {
        var files = e.target.files;
