<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            cursor: grab;
        }
        #monument-preview-box:active {
            cursor: grabbing;
        }
        #sidebar-controls {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

<h1>Онлайн-примерка гравировки на памятник (3D)</h1>

<div id="main-container">
    <div id="monument-preview-box"></div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">2. Выбор шрифта</span>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="cursive, serif">Каллиграфический (Курсив)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">3. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="hint-box">
            🔄 Зажмите левую кнопку мыши на памятнике, чтобы вращать его и рассмотреть объем. Изменения применяются мгновенно.
        </div>
    </div>
</div>

<script>
    var fileInput = document.getElementById('file-input');
    var textFio = document.getElementById('text-fio');
    var textDates = document.getElementById('text-dates');
    var fontSelector = document.getElementById('font-selector');
    var previewBox = document.getElementById('monument-preview-box');

    var loadedImage = null;
    var monumentMaterial = null;

    var textureCanvas = document.createElement('canvas');
    textureCanvas.width = 1024;
    textureCanvas.height = 1024;
    var ctx = textureCanvas.getContext('2d');

    function redrawTexture() {
        ctx.fillStyle = '#121212';
        ctx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);
        
        ctx.fillStyle = 'rgba(255,255,255,0.03)';
        for (var i = 0; i < 500; i++) {
            var x = Math.random() * textureCanvas.width;
            var y = Math.random() * textureCanvas.height;
            ctx.fillRect(x, y, 2, 2);
        }

        if (loadedImage) {
            ctx.save();
            var imgW = 360;
            var imgH = 460;
            var imgX = (textureCanvas.width - imgW) / 2;
            var imgY = 120;

            ctx.beginPath();
            ctx.ellipse(imgX + imgW/2, imgY + imgH/2, imgW/2, imgH/2, 0, 0, Math.PI * 2);
            ctx.clip();

            ctx.filter = 'grayscale(100%) contrast(160%) brightness(120%)';
            ctx.drawImage(loadedImage, imgX, imgY, imgW, imgH);
            ctx.filter = 'none';

            var gradient = ctx.createRadialGradient(
                imgX + imgW/2, imgY + imgH/2, imgW * 0.25, 
                imgX + imgW/2, imgY + imgH/2, imgW * 0.5
            );
            gradient.addColorStop(0, 'rgba(18,18,18,0)');
            gradient.addColorStop(0.7, 'rgba(18,18,18,0.4)');
            gradient.addColorStop(1, 'rgba(18,18,18,1)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(imgX, imgY, imgW, imgH);
            ctx.restore();
        }

        var selectedFont = fontSelector.value;
        ctx.fillStyle = '#e0e0e0';
        ctx.textAlign = 'center';
        ctx.font = 'bold 38px ' + selectedFont;
        
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 2;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        var fioValue = textFio.value || "ИВАНОВ\nИВАН\nИВАНОВИЧ";
        var lines = fioValue.toUpperCase().split(/[\s\n]+/);
        var startY = 660;
        
        for (var j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], textureCanvas.width / 2, startY + (j * 52));
        }

        ctx.font = 'bold 30px ' + selectedFont;
        var datesValue = textDates.value || "10.05.1950 — 22.11.2023";
        ctx.fillText(datesValue, textureCanvas.width / 2, startY + (lines.length * 52) + 25);
        
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        if (monumentMaterial && monumentMaterial.map) {
            monumentMaterial.map.needsUpdate = true;
        }
    }

    var scene = new THREE.Scene();
    
    var camera = new THREE.PerspectiveCamera(45, previewBox.clientWidth / previewBox.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.8, 4.0);

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(previewBox.clientWidth, previewBox.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    previewBox.appendChild(renderer.domElement);

    var ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    var dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(5, 8, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    var pointLight = new THREE.PointLight(0xffffff, 0.4, 10);
    pointLight.position.set(-2, 3, 3);
    scene.add(pointLight);

    var floorGeo = new THREE.PlaneGeometry(10, 10);
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.9 });
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.2;
    floor.receiveShadow = true;
    scene.add(floor);

    var monumentGroup = new THREE.Group();
    monumentGroup.position.y = -0.3;
    scene.add(monumentGroup);

    var baseGeo = new THREE.BoxGeometry(1.6, 0.2, 0.6);
    var baseMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.2, metalness: 0.1 });
    var baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.6;
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    monumentGroup.add(baseMesh);

    var width = 1.1;
    var height = 1.6;
    var shape = new THREE.Shape();
    shape.moveTo(-width/2, -height/2);
    shape.lineTo(-width/2, height/2 - width/2);
    shape.absarc(0, height/2 - width/2, width/2, Math.PI, 0, true);
    shape.lineTo(width/2, -height/2);
    shape.closePath();

    var extrudeSettings = {
        depth: 0.12,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.015,
        bevelThickness: 0.015
    };

    var steleGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    steleGeo.center();

    var canvasTexture = new THREE.CanvasTexture(textureCanvas);
    monumentMaterial = new THREE.MeshStandardMaterial({
        map: canvasTexture,
        roughness: 0.2,
        metalness: 0.1
    });
