<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        #sidebar-controls {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
            max-height: 650px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], select, textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        .screenshot-btn {
            background-color: #0288d1;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
            margin-top: 10px;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
    <!-- Подключение Three.js и OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<h1>Онлайн-примерка гравировки на памятник (3D)</h1>

<div id="main-container">
    <div id="monument-preview-box"></div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Геометрия памятника</span>
            <label>Форма плиты</label>
            <select id="shape-selector">
                <option value="arc">Арка (скругленная сверху)</option>
                <option value="rect">Прямоугольник (строгий)</option>
                <option value="angel">Ангел (фигурный силуэт)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">2. Фотография (Лицевая сторона)</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">3. Выбор шрифта</span>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="cursive, serif">Каллиграфический (Курсив)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">4. Гравировка (Лицевая сторона)</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="input-group">
            <span class="section-title">5. Гравировка (Обратная сторона)</span>
            <label>Текст / Эпитафия на обороте</label>
            <textarea id="text-back" placeholder="Помним, любим, скорбим"></textarea>
        </div>

        <button class="screenshot-btn" id="screenshot-btn">Скачать скриншот макета</button>

        <div class="hint-box">
            🔄 Зажмите левую кнопку мыши для вращения на 360°. Используйте колесико мыши для приближения и отдаления.
        </div>
    </div>
</div>

<script>
    var fileInput = document.getElementById('file-input');
    var textFio = document.getElementById('text-fio');
    var textDates = document.getElementById('text-dates');
    var textBack = document.getElementById('text-back');
    var fontSelector = document.getElementById('font-selector');
    var shapeSelector = document.getElementById('shape-selector');
    var screenshotBtn = document.getElementById('screenshot-btn');
    var previewBox = document.getElementById('monument-preview-box');

    var loadedImage = null;
    var canvasTexture = null;
    var steleMesh = null;

    // Комбинированный холст: левая половина (0..1024) - Лицо, правая половина (1024..2048) - Оборот
    var textureCanvas = document.createElement('canvas');
    textureCanvas.width = 2048;
    textureCanvas.height = 1024;
    var ctx = textureCanvas.getContext('2d');

    function redrawTexture() {
        var currentShape = shapeSelector.value;
        var selectedFont = fontSelector.value;

        // 1. Очистка и заливка базовым цветом камня (обе стороны)
        ctx.fillStyle = '#151515';
        ctx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);
        
        // Текстурная крошка гранита
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        for (var i = 0; i < 1200; i++) {
            var x = Math.random() * textureCanvas.width;
            var y = Math.random() * textureCanvas.height;
            ctx.fillRect(x, y, 2, 2);
        }

        // --- ЛЕВАЯ ПОЛОВИНА: ЛИЦЕВАЯ СТОРОНА (X от 0 до 1024) ---
        // Смещение содержимого вправо для формы "Ангел", чтобы надписи не заезжали на силуэт
        var frontOffset = (currentShape === 'angel') ? 160 : 0;
        var centerXFront = 512 + frontOffset;

        if (loadedImage) {
            ctx.save();
            var imgW = 340;
            var imgH = 440;
            var imgX = centerXFront - imgW / 2;
            var imgY = 100;

            ctx.beginPath();
            ctx.ellipse(imgX + imgW/2, imgY + imgH/2, imgW/2, imgH/2, 0, 0, Math.PI * 2);
            ctx.clip();

            // Рассчитываем пропорции загруженного изображения (Object-fit: cover)
            var imgRatio = loadedImage.width / loadedImage.height;
            var targetRatio = imgW / imgH;
            var srcX = 0, srcY = 0, srcW = loadedImage.width, srcH = loadedImage.height;

            if (imgRatio > targetRatio) {
                srcW = loadedImage.height * targetRatio;
                srcX = (loadedImage.width - srcW) / 2;
            } else {
                srcH = loadedImage.width / targetRatio;
                srcY = (loadedImage.height - srcH) / 2;
            }

            ctx.filter = 'grayscale(100%) contrast(155%) brightness(115%)';
            ctx.drawImage(loadedImage, srcX, srcY, srcW, srcH, imgX, imgY, imgW, imgH);
            ctx.filter = 'none';

            var gradient = ctx.createRadialGradient(
                imgX + imgW/2, imgY + imgH/2, imgW * 0.28, 
                imgX + imgW/2, imgY + imgH/2, imgW * 0.5
            );
            gradient.addColorStop(0, 'rgba(21,21,21,0)');
            gradient.addColorStop(0.7, 'rgba(21,21,21,0.4)');
            gradient.addColorStop(1, 'rgba(21,21,21,1)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(imgX, imgY, imgW, imgH);
            ctx.restore();
        }

        ctx.fillStyle = '#dedede';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px ' + selectedFont;
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        var fioValue = textFio.value || "ИВАНОВ\nИВАН\nИВАНОВИЧ";
        var lines = fioValue.toUpperCase().split(/[\s\n]+/);
        var startY = 640;
        
        for (var j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], centerXFront, startY + (j * 54));
        }

        ctx.font = 'bold 28px ' + selectedFont;
        var datesValue = textDates.value || "10.05.1950 — 22.11.2023";
        ctx.fillText(datesValue, centerXFront, startY + (lines.length * 54) + 30);

        // --- ПРАВАЯ ПОЛОВИНА: ОБРАТНАЯ СТОРОНА (X от 1024 до 2048) ---
        // Для ангела на обороте смещаем область текста зеркально (влево), т.к. сторона развернута
        var backOffset = (currentShape === 'angel') ? -160 : 0;
        var centerXBack = 1536 + backOffset;

        ctx.font = 'italic 32px ' + selectedFont;
        var backValue = textBack.value || "Помним, любим, скорбим";
        var backLines = backValue.split('\n');
        var startYBack = 450 - (backLines.length * 25);

        for (var k = 0; k < backLines.length; k++) {
            ctx.fillText(backLines[k], centerXBack, startYBack + (k * 50));
        }
        
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        if (canvasTexture) {
            canvasTexture.needsUpdate = true;
        }
    }

    // Инициализация Three.js сцены
    var scene = new THREE.Scene();
    
    var camera = new THREE.PerspectiveCamera(45, previewBox.clientWidth / previewBox.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.7, 4.6);

    var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(previewBox.clientWidth, previewBox.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    previewBox.appendChild(renderer.domElement);

    // Подключение OrbitControls
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.0;
    controls.maxDistance = 8.0;
    controls.target.set(0, 0, 0);

    // Освещение
    var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 8, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    var pointLight = new THREE.PointLight(0xffffff, 0.4, 10);
    pointLight.position.set(-3, 3, 4);
    scene.add(pointLight);

    // Земля/Пол
    var floorGeo = new THREE.PlaneGeometry(12, 12);
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1d, roughness: 0.85 });
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Статичное общее основание (Цоколь)
    var baseGeo = new THREE.BoxGeometry(1.6, 0.2, 0.6);
    var baseMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.25, metalness: 0.1 });
    var baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.set(0, -0.9, 0);
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    scene.add(baseMesh);

    // Создание материалов
    canvasTexture = new THREE.CanvasTexture(textureCanvas);
    
    var monumentMaterial = new THREE.MeshStandardMaterial({
        map: canvasTexture,
        roughness: 0.2,
        metalness: 0.1
    });

    var sideMaterial = new THREE.MeshStandardMaterial({
        color: 0x181818,
        roughness: 0.25,
        metalness: 0.1
    });

    function rebuildMonumentGeometry() {
        if (steleMesh) scene.remove(steleMesh);

        var width = 1.1;
        var height = 1.6;
        var shape = new THREE.Shape();
        var currentShapeType = shapeSelector.value;

        if (currentShapeType === 'arc') {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, height/2 - width/2);
            shape.absarc(0, height/2 - width/2, width/2, Math.PI, 0, true);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        } else if (currentShapeType === 'angel') {
            // Математический силуэт скорбящего ангела слева и ровной плиты справа
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, -0.4);
            // Плавные изгибы крыла и силуэта спины
            shape.quadraticCurveTo(-width/2 - 0.1, -0.1, -width/2 + 0.05, 0.2);
            shape.quadraticCurveTo(-width/2 - 0.2, 0.4, -width/3, 0.6);
            shape.quadraticCurveTo(-width/4, 0.7, -width/5, 0.75);
            // Голова/округление сверху
            shape.absarc(-width/8, 0.65, 0.12, Math.PI, 0, true);
            // Плавный переход к ровному правому краю плиты
            shape.quadraticCurveTo(0, 0.8, width/2, 0.8);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        } else {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, height/2);
            shape.lineTo(width/2, height/2);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        }

        var extrudeSettings = {
            depth: 0.12,
            bevelEnabled: true,
            bevelSegments: 4,
            steps: 1,
            bevelSize: 0.015,
            bevelThickness: 0.015
        };

        var steleGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        
        steleGeo.computeBoundingBox();
        var bbox = steleGeo.boundingBox;
        var max = bbox.max;
        var min = bbox.min;
        var rangeX = max.x - min.x;
        var rangeY = max.y - min.y;
        
        var uvAttribute = steleGeo.attributes.uv;
        var posAttribute = steleGeo.attributes.position;

        for (var i = 0; i < uvAttribute.count; i++) {
            var posX = posAttribute.getX(i);
            var posY = posAttribute.getY(i);
            var posZ = posAttribute.getZ(i);
            
            // Наложение текстур: Лицо (Z > 0.11), Оборот (Z < 0.01), Торцы - чистый камень
            if (posZ > 0.11) {
                // Лицевая грань: маппим в левую половину холста (U: 0.0 -> 0.5)
                var uFront = (posX - min.x) / rangeX * 0.5;
                var vFront = (posY - min.y) / rangeY;
                uvAttribute.setXY(i, uFront, vFront);
            } else if (posZ < 0.01) {
                // Обратная грань: маппим в правую половину холста (U: 0.5 -> 1.0) с инверсией X
                var uBack = 0.5 + (1.0 - (posX - min.x) / rangeX) * 0.5;
                var vBack = (posY - min.y) / rangeY;
                uvAttribute.setXY(i, uBack, vBack);
            } else {
                // Торцы сдвигаем в невидимую зону или даем фиксированные координаты для sideMaterial
                uvAttribute.setXY(i, 0, 0);
            }
        }
        uvAttribute.needsUpdate = true;
        steleGeo.center();

        steleMesh = new THREE.Mesh(steleGeo, [monumentMaterial, sideMaterial]);
        steleMesh.position.set(0, 0, 0);
        steleMesh.castShadow = true;
        steleMesh.receiveShadow = true;
        scene.add(steleMesh);
    }

    shapeSelector.onchange = function() {
        rebuildMonumentGeometry();
        redrawTexture();
    };

    rebuildMonumentGeometry();
    redrawTexture();

    // Загрузка фото портрета
    fileInput.onchange = function(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                loadedImage = img;
                redrawTexture();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(files[0]);
    };

    // Слушатели ввода данных
    textFio.oninput = redrawTexture;
    textDates.oninput = redrawTexture;
    textBack.oninput = redrawTexture;
    fontSelector.onchange = redrawTexture;

    // Скриншот
    screenshotBtn.onclick = function() {
        renderer.render(scene, camera);
        var dataURL = renderer.domElement.toDataURL('image/png');
        var link = document.createElement('a');
        link.download = 'monument_3d_design.png';
        link.href = dataURL;
        link.click();
    };

    // Анимационный цикл
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // Ресайз окна браузера
    window.addEventListener('resize', function() {
        if (previewBox.clientWidth && previewBox.clientHeight) {
            camera.aspect = previewBox.clientWidth / previewBox.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(previewBox.clientWidth, previewBox.clientHeight);
        }
    });
</script>
</body>
</html>
