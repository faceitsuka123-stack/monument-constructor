<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1250px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        /* Окно просмотра */
        #monument-preview-box {
            flex: 2;
            height: 680px;
            background-color: #1a1a1a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        /* Единая сборка для идеального выравнивания памятника строго по центру */
        #monument-assembly {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        /* Фигурная стела-волна в точности как на вашем примере */
        #stele {
            width: 300px;
            height: 480px;
            background: linear-gradient(135deg, #1c1c1c 0%, #0d0d0d 40%, #1c1c1c 50%, #080808 60%, #111111 100%);
            border-radius: 150px 150px 0 0;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }
        /* Вертикальный глянцевый блик */
        #stele::after {
            content: '';
            position: absolute;
            top: 0; left: 135px; width: 30px; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.05), rgba(255,255,255,0));
            pointer-events: none;
            z-index: 10;
        }
        /* Подставка (тумба) */
        #stone-base {
            width: 360px;
            height: 45px;
            background: linear-gradient(to bottom, #2a2a2a 0%, #151515 20%, #080808 100%);
            border: 2px solid #333;
            border-top: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            margin-top: -2px;
        }
        /* Контейнер для портрета с ручным позиционированием */
        #portrait-wrapper {
            width: 140px;
            height: 180px;
            position: absolute;
            top: 40px;
            left: 80px; 
            overflow: hidden;
            display: none; 
            border-radius: 50%;
            z-index: 3;
        }
        #portrait-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%) brightness(110%);
        }
        /* Безопасная градиентная вуаль для растушевки краев фото */
        #portrait-fade {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(19,19,19,0) 30%, rgba(19,19,19,0.5) 65%, rgba(19,19,19,1) 98%);
        }
        /* Текстовый блок с ручным позиционированием */
        #text-block {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 4;
            pointer-events: none;
        }
        #display-fio {
            color: #dedede;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            line-height: 1.4;
            text-shadow: 1px 1px 1px #000, 1px 2px 0px #000;
            white-space: pre-line;
            font-family: 'Times New Roman', Georgia, serif;
            width: 100%;
        }
        #display-dates {
            color: #b8b8b8;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 1px #000;
            font-family: 'Times New Roman', Georgia, serif;
            width: 100%;
        }
        /* Панель настроек */
        #sidebar-controls {
            flex: 1;
            min-width: 340px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
            max-height: 680px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 3px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #555;
        }
        .slider-group input {
            flex: 1;
        }
        label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

<h1>Онлайн-примерка гравировки на памятник</h1>

<div id="main-container">
    <div id="monument-preview-box">
        <div id="monument-assembly">
            <div id="stele">
                <!-- Портрет -->
                <div id="portrait-wrapper">
                    <img id="portrait-img" src="" alt="Портрет">
                    <div id="portrait-fade"></div>
                </div>
                <!-- Текст -->
                <div id="text-block">
                    <div id="display-fio"></div>
                    <div id="display-dates"></div>
                </div>
            </div>
            <div id="stone-base"></div>
        </div>
    </div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- Настройка фотографии ползунками -->
        <div class="input-group">
            <label>Размер фотографии</label>
            <div class="slider-group">
                <input type="range" id="photo-size" min="60" max="240" value="140">
            </div>
            <label>Положение фото (Выше / Ниже)</label>
            <div class="slider-group">
                <input type="range" id="photo-y" min="10" max="250" value="40">
            </div>
            <label>Положение фото (Левее / Правее)</label>
            <div class="slider-group">
                <input type="range" id="photo-x" min="0" max="240" value="80">
            </div>
        </div>

        <div class="input-group">
            <span class="section-title">2. Выбор шрифта</span>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="cursive, serif">Каллиграфический (Курсив)</option>
            </select>
        </div>

        <!-- Настройка текста ползунками -->
        <div class="input-group">
            <label>Размер букв (ФИО)</label>
            <div class="slider-group">
                <input type="range" id="text-size" min="12" max="35" value="18">
            </div>
            <label>Положение текста (Выше / Ниже)</label>
            <div class="slider-group">
                <input type="range" id="text-y" min="10" max="350" value="30">
            </div>
        </div>

        <div class="input-group">
            <span class="section-title">3. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>
    </div>
</div>

<script>
    var fileInput = document.getElementById('file-input');
    var portraitWrapper = document.getElementById('portrait-wrapper');
    var portraitImg = document.getElementById('portrait-img');
    
    var textFio = document.getElementById('text-fio');
    var textDates = document.getElementById('text-dates');
    
    var displayFio = document.getElementById('display-fio');
