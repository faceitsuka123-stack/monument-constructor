<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        #sidebar-controls {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
            max-height: 650px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #444;
            margin-bottom: 4px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], select, textarea {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: block;
        }
        .screenshot-btn {
            background-color: #0288d1;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            display: block;
            margin-top: 5px;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<h1>Online 3D Monument Customizer</h1>

<div id="main-container">
    <div id="monument-preview-box"></div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Геометрия памятника</span>
            <label>Форма плиты</label>
            <select id="shape-selector">
                <option value="arc">Арка (скругленная сверху)</option>
                <option value="rect">Прямоугольник (строгий)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">2. Фотография (Лицевая сторона)</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">3. Выбор шрифта</span>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="cursive, serif">Каллиграфический (Курсив)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">4. Гравировка (Лицевая сторона)</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="input-group">
            <span class="section-title">5. Гравировка (Обратная сторона)</span>
            <label>Текст / Эпитафия на обороте</label>
            <textarea id="text-back" placeholder="Помним, любим, скорбим..."></textarea>
        </div>

        <button class="screenshot-btn" id="screenshot-btn">Скачать скриншот макета</button>

        <div class="hint-box">
            🔄 Зажмите левую кнопку мыши для вращения. Используйте колесико мыши для приближения и отдаления памятника.
        </div>
    </div>
</div>

<script>
    var fileInput = document.getElementById('file-input');
    var textFio = document.getElementById('text-fio');
    var textDates = document.getElementById('text-dates');
    var textBack = document.getElementById('text-back');
    var fontSelector = document.getElementById('font-selector');
    var shapeSelector = document.getElementById('shape-selector');
    var screenshotBtn = document.getElementById('screenshot-btn');
    var previewBox = document.getElementById('monument-preview-box');

    var loadedImage = null;
    var monumentMaterial = null;
    var sideMaterial = null;
    var steleMesh = null;

    // Создаем комбинированный холст (лево = лицо, право = задник)
    var textureCanvas = document.createElement('canvas');
    textureCanvas.width = 2048;
    textureCanvas.height = 1024;
    var ctx = textureCanvas.getContext('2d');

    function redrawTexture() {
        ctx.fillStyle = '#151515';
        ctx.fillRect(0, 0, textureCanvas.width, textureCanvas.height);
        
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        for (var i = 0; i < 1000; i++) {
            var x = Math.random() * textureCanvas.width;
            var y = Math.random() * textureCanvas.height;
            ctx.fillRect(x, y, 2, 2);
        }

        var selectedFont = fontSelector.value;
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;

        // --- ЛИЦЕВАЯ СТОРОНА ---
        if (loadedImage) {
            ctx.save();
            var imgW = 340;
            var imgH = 440;
            var imgX = (1024 - imgW) / 2;
            var imgY = 100;

            ctx.beginPath();
            ctx.ellipse(imgX + imgW/2, imgY + imgH/2, imgW/2, imgH/2, 0, 0, Math.PI * 2);
            ctx.clip();

            var srcX = 0, srcY = 0, srcW = loadedImage.width, srcH = loadedImage.height;
            var aspectCanvas = imgW / imgH;
            var aspectImg = loadedImage.width / loadedImage.height;

            if (aspectImg > aspectCanvas) {
                srcW = loadedImage.height * aspectCanvas;
                srcX = (loadedImage.width - srcW) / 2;
            } else {
                srcH = loadedImage.width / aspectCanvas;
                srcY = (loadedImage.height - srcH) / 2;
            }

            ctx.filter = 'grayscale(100%) contrast(155%) brightness(115%)';
            ctx.drawImage(loadedImage, srcX, srcY, srcW, srcH, imgX, imgY, imgW, imgH);
            ctx.filter = 'none';

            var gradient = ctx.createRadialGradient(
                imgX + imgW/2, imgY + imgH/2, imgW * 0.28, 
                imgX + imgW/2, imgY + imgH/2, imgW * 0.5
            );
            gradient.addColorStop(0, 'rgba(21,21,21,0)');
            gradient.addColorStop(0.7, 'rgba(21,21,21,0.4)');
            gradient.addColorStop(1, 'rgba(21,21,21,1)');
            ctx.fillStyle = gradient;
            ctx.fillRect(imgX, imgY, imgW, imgH);
            ctx.restore();
        }

        ctx.fillStyle = '#dedede';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px ' + selectedFont;
        
        var fioValue = textFio.value || "ИВАНОВ\nИВАН\nИВАНОВИЧ";
        var lines = fioValue.toUpperCase().split(/[\s\n]+/);
        var startY = 640;
        
        for (var j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], 1024 / 2, startY + (j * 54));
        }

        ctx.font = 'bold 28px ' + selectedFont;
        var datesValue = textDates.value || "10.05.1950 — 22.11.2023";
        ctx.fillText(datesValue, 1024 / 2, startY + (lines.length * 54) + 30);

        // --- ОБРАТНАЯ СТОРОНА ---
        ctx.fillStyle = '#c8c8c8';
        ctx.font = 'italic 32px ' + selectedFont;
        
        var backValue = textBack.value || "Помним, любим, скорбим";
        var backLines = backValue.split('\n');
        var backStartY = 450 - ((backLines.length - 1) * 25);
        
        for (var k = 0; k < backLines.length; k++) {
            ctx.fillText(backLines[k], 1024 + 512, backStartY + (k * 50));
        }
        
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        if (monumentMaterial && monumentMaterial.map) {
            monumentMaterial.map.needsUpdate = true;
        }
    }

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, previewBox.clientWidth / previewBox.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.7, 4.2);

    var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(previewBox.clientWidth, previewBox.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    previewBox.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 7;

    var ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    var dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
    dirLight.position.set(5, 8, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    var pointLight = new THREE.PointLight(0xffffff, 0.25, 10);
    pointLight.position.set(-4, 3, 5);
    scene.add(pointLight);

    var floorGeo = new THREE.PlaneGeometry(12, 12);
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.9 });
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.2;
    floor.receiveShadow = true;
    scene.add(floor);

    var monumentGroup = new THREE.Group();
    monumentGroup.position.y = -0.3;
    scene.add(monumentGroup);

    var baseGeo = new THREE.BoxGeometry(1.6, 0.2, 0.6);
    var baseMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.2, metalness: 0.1 });
    var baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.6;
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    monumentGroup.add(baseMesh);

    var canvasTexture = new THREE.CanvasTexture(textureCanvas);
    monumentMaterial = new THREE.MeshStandardMaterial({
        map: canvasTexture,
        roughness: 0.18,
        metalness: 0.05
    });

    sideMaterial = new THREE.MeshStandardMaterial({
        color: 0x161616,
        roughness: 0.22,
        metalness: 0.05
    });

    function rebuildMonumentGeometry() {
        if (steleMesh) monumentGroup.remove(steleMesh);

        var width = 1.1;
        var height = 1.6;
        var shape = new THREE.Shape();
        var currentShapeType = shapeSelector.value;

        if (currentShapeType === 'arc') {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, height/2 - width/2);
            shape.absarc(0, height/2 - width/2, width/2, Math.PI, 0, true);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        } else {
            shape.moveTo(-width/2, -height/2);
            shape.lineTo(-width/2, height/2);
            shape.lineTo(width/2, height/2);
            shape.lineTo(width/2, -height/2);
            shape.closePath();
        }

        var extrudeSettings = {
            depth: 0.12,
            bevelEnabled: true,
            bevelSegments: 3,
            steps: 1,
            bevelSize: 0.015,
            bevelThickness: 0.015
        };

        var steleGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        
        steleGeo.computeBoundingBox();
        var bbox = steleGeo.boundingBox;
        var max = bbox.max;
        var min = bbox.min;
        var offset = new THREE.Vector2(-min.x, -min.y);
        var range = new THREE.Vector2(max.x - min.x, max.y - min.y);
        
        var uvAttribute = steleGeo.attributes.uv;
        
        for (var i = 0; i < uvAttribute.count; i++) {
            var posX = steleGeo.attributes.position.getX(i);
            var posY = steleGeo.attributes.position.getY(i);
            var posZ = steleGeo.attributes.position.getZ(i);
            
            var u = (posX + offset.x) / range.x;
            var v = (posY + offset.y) / range.y;

            if (posZ > 0.08) {
                // Лицо: левая половина Canvas
                uvAttribute.setXY(i, u * 0.5, v);
            } else if (posZ < 0.04) {
                // Задник: правая половина Canvas с разворотом U против отзеркаливания
                uvAttribute.setXY(i, 0.5 + (1.0 - u) * 0.5, v);
            }
        }
        uvAttribute.needsUpdate = true;
        steleGeo.center();

        steleMesh = new THREE.Mesh(steleGeo, [monumentMaterial, sideMaterial]);
        steleMesh.position.set(0, 0.3, 0);
        steleMesh.castShadow = true;
        steleMesh.receiveShadow = true;
        monumentGroup.add(steleMesh);
    }

    shapeSelector.onchange = function() {
        rebuildMonumentGeometry();
        redrawTexture();
    };

    rebuildMonumentGeometry();
    redrawTexture();

    fileInput.onchange = function(event) {
        var files = event.target.files;
        if (!files || files.length === 0) return;

        var reader = new FileReader();
        reader.onload = function(e) {
            var img = new Image();
            img.onload = function() {
                loadedImage = img;
                redrawTexture();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(files[0]);
    };

    textFio.oninput = redrawTexture;
    textDates.oninput = redrawTexture;
    textBack.oninput = redrawTexture;
    fontSelector.onchange = redrawTexture;

    screenshotBtn.onclick = function() {
        renderer.render(scene, camera);
        var dataURL = renderer.domElement.toDataURL('image/png');
        var link = document.createElement('a');
        link.download = 'monument_3d_render.png';
        link.href = dataURL;
        link.click();
    };

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function() {
        if (previewBox.clientWidth && previewBox.clientHeight) {
            camera.aspect = previewBox.clientWidth / previewBox.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(previewBox.clientWidth, previewBox.clientHeight);
        }
    });
</script>
</body>
</html>
