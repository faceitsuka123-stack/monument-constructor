<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-примерка памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1250px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 680px;
            background-color: #1a1a1a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        canvas {
            background-color: #1a1a1a;
            display: block;
            border-radius: 8px;
        }
        #sidebar-controls {
            flex: 1;
            min-width: 340px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
            max-height: 680px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 3px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #555;
        }
        .slider-group input {
            flex: 1;
        }
        label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            margin-top: 5px;
        }
        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

<h1>Онлайн-примерка гравировки на памятник</h1>

<div id="main-container">
    <div id="monument-preview-box">
        <canvas id="monumentCanvas" width="450" height="640"></canvas>
    </div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <label>Размер фотографии</label>
            <div class="slider-group">
                <input type="range" id="photo-size" min="60" max="220" value="140">
            </div>
            <label>Положение фото (Выше / Ниже)</label>
            <div class="slider-group">
                <input type="range" id="photo-y" min="20" max="300" value="140">
            </div>
            <label>Положение фото (Левее / Правее)</label>
            <div class="slider-group">
                <input type="range" id="photo-x" min="50" max="400" value="225">
            </div>
        </div>

        <div class="input-group">
            <span class="section-title">2. Выбор шрифта</span>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="'Courier New', monospace">Каллиграфический (Курсив)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Размер букв (ФИО)</label>
            <div class="slider-group">
                <input type="range" id="text-size" min="12" max="35" value="18">
            </div>
            <label>Положение текста (Выше / Ниже)</label>
            <div class="slider-group">
                <input type="range" id="text-y" min="250" max="520" value="380">
            </div>
        </div>

        <div class="input-group">
            <span class="section-title">3. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="ИВАНОВА ЮЛИЯ">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="1981.11.28 — 19.IV.2001">
        </div>
    </div>
</div>

<script>
    var canvas = document.getElementById('monumentCanvas');
    var ctx = canvas.getContext('2d');

    var inputFio = "";
    var inputDates = "";
    var sourceImage = null;
    var selectedFontFamily = "'Times New Roman', Georgia, serif";

    var sliderPhotoSize = document.getElementById('photo-size');
    var sliderPhotoX = document.getElementById('photo-x');
    var sliderPhotoY = document.getElementById('photo-y');
    var sliderTextSize = document.getElementById('text-size');
    var sliderTextY = document.getElementById('text-y');
    var fontSelector = document.getElementById('font-selector');

    function renderMonument() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Рисуем подставку (тумбу)
        let baseGrad = ctx.createLinearGradient(40, 530, 40, 580);
        baseGrad.addColorStop(0, '#2a2a2a');
        baseGrad.addColorStop(0.2, '#151515');
        baseGrad.addColorStop(1, '#080808');
        ctx.fillStyle = baseGrad;
        ctx.fillRect(40, 530, 370, 50);
        ctx.strokeStyle = "#3a3a3a";
        ctx.lineWidth = 2;
        ctx.strokeRect(40, 530, 370, 50);

        ctx.strokeStyle = "rgba(255,255,255,0.15)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(41, 531); ctx.lineTo(409, 531); ctx.stroke();

        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(25, 580, 400, 12);

        // 2. Рисуем фигурную стелу
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(85, 530);
        ctx.quadraticCurveTo(70, 270, 85, 120);
        ctx.quadraticCurveTo(80, 85, 75, 75);
        ctx.quadraticCurveTo(100, 75, 115, 85);
        ctx.quadraticCurveTo(240, -10, 365, 120);
        ctx.quadraticCurveTo(380, 270, 365, 530);
        ctx.closePath();

        let stoneGrad = ctx.createLinearGradient(75, 30, 375, 530);
        stoneGrad.addColorStop(0, '#1c1c1c');
        stoneGrad.addColorStop(0.3, '#0d0d0d');
        stoneGrad.addColorStop(0.5, '#181818'); 
        stoneGrad.addColorStop(0.7, '#080808');
        stoneGrad.addColorStop(1, '#111111');
        ctx.fillStyle = stoneGrad;
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

        // 3. Рисуем и обрабатываем портрет
        if (sourceImage) {
            let pSize = parseInt(sliderPhotoSize.value);
            let pX = parseInt(sliderPhotoX.value);
            let pY = parseInt(sliderPhotoY.value);

            let aspect = sourceImage.width / sourceImage.height;
            let w = pSize;
            let h = w / aspect;

            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            let tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(sourceImage, 0, 0, w, h);

            try {
                let imgData = tCtx.getImageData(0, 0, w, h);
                let data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let b = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    b = b > 115 ? Math.min(255, b * 1.35) : Math.max(0, b * 0.4);
                    data[i] = b * 0.93; data[i + 1] = b * 0.95; data[i + 2] = b * 0.97;
                }
                tCtx.putImageData(imgData, 0, 0);
            } catch(e) { console.log(e); }

            let maskCanvas = document.createElement('canvas');
            maskCanvas.width = w;
            maskCanvas.height = h;
            let mCtx = maskCanvas.getContext('2d');
            mCtx.drawImage(tempCanvas, 0, 0);

            mCtx.globalCompositeOperation = 'destination-out';
            let maskGrad = mCtx.createRadialGradient(w/2, h/2, w/3, w/2, h/2, w/2);
            maskGrad.addColorStop(0, 'rgba(0,0,0,0)');
            maskGrad.addColorStop(0.7, 'rgba(0,0,0,0.6)');
            maskGrad.addColorStop(1, 'rgba(0,0,0,1)');
            mCtx.fillStyle = maskGrad;
            mCtx.fillRect(0, 0, w, h);

            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(maskCanvas, pX - w/2, pY - h/2);
            ctx.restore();
        }

        // 4. Отрисовка текста гравировки
        ctx.save();
        ctx.textAlign = "center";
        ctx.shadowColor = "#000000";
        ctx.shadowBlur = 1;
