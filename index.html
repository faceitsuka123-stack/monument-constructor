<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1250px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            cursor: move;
        }
        canvas {
            background-color: #1a1a1a;
            display: block;
            border-radius: 8px;
        }
        #sidebar-controls {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Онлайн 3D-примерка гравировки на памятник</h1>

<div id="main-container">
    <div id="monument-preview-box">
        <canvas id="monumentCanvas" width="450" height="600"></canvas>
    </div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">2. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="hint-box">
            🔄 Зажмите левую кнопку мыши внутри левого окна и двигайте её, чтобы плавно вращать памятник в 3D со всех сторон!
        </div>
    </div>
</div>

<script>
    var canvas = document.getElementById('monumentCanvas');
    var ctx = canvas.getContext('2d');
    var previewBox = document.getElementById('monument-preview-box');

    var inputFio = "";
    var inputDates = "";
    var userImage = null;

    // Параметры 3D камеры и вращения
    var angleX = -0.25; 
    var angleY = 0.4;  
    var isDragging = false;
    var previousMousePosition = { x: 0, y: 0 };

    // Создаем холст текстуры для лицевой стороны (512x512)
    var textureCanvas = document.createElement('canvas');
    textureCanvas.width = 512;
    textureCanvas.height = 512;
    var tCtx = textureCanvas.getContext('2d');

    // Математическая 3D-модель (Вершины)
    // Вершины Стелы (0-7)
    var steleBaseVertices = [
        {x: -60, y: -180, z: -15}, {x: 60, y: -180, z: -15}, {x: 60, y: 80, z: -15}, {x: -60, y: 80, z: -15},
        {x: -60, y: -180, z: 15},  {x: 60, y: -180, z: 15},  {x: 60, y: 80, z: 15},  {x: -60, y: 80, z: 15}
    ];
    // Вершины Тумбы (8-15)
    var baseVertices = [
        {x: -85, y: 80, z: -30},  {x: 85, y: 80, z: -30},  {x: 85, y: 110, z: -30},  {x: -85, y: 110, z: -30},
        {x: -85, y: 80, z: 30},   {x: 85, y: 80, z: 30},   {x: 85, y: 110, z: 30},   {x: -85, y: 110, z: 30}
    ];

    function project(vertex) {
        // Поворот по оси Y
        var x1 = vertex.x * Math.cos(angleY) - vertex.z * Math.sin(angleY);
        var z1 = vertex.x * Math.sin(angleY) + vertex.z * Math.cos(angleY);
        // Поворот по оси X
        var y2 = vertex.y * Math.cos(angleX) - z1 * Math.sin(angleX);
        var z2 = vertex.y * Math.sin(angleX) + z1 * Math.cos(angleX);

        var distance = 450;
        var scale = distance / (distance + z2) * 1.3;
        return {
            x: x1 * scale + canvas.width / 2,
            y: y2 * scale + canvas.height / 2 + 30,
            z: z2
        };
    }

    function updateTexture() {
        tCtx.fillStyle = "#222222";
        tCtx.fillRect(0, 0, 512, 512);

        // Отрисовка портрета
        if (userImage) {
            var aspect = userImage.width / userImage.height;
            var w = 240; var h = w / aspect;
            if (h > 260) { h = 260; w = h * aspect; }
            var x = (512 - w) / 2; var y = 50;

            var tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            var tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(userImage, 0, 0, w, h);

            var imgData = tempCtx.getImageData(0, 0, w, h);
            var data = imgData.data;
            for (var i = 0; i < data.length; i += 4) {
                var b = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                b = b > 120 ? Math.min(255, b * 1.4) : Math.max(45, b * 0.35);
                data[i] = b; data[i + 1] = b; data[i + 2] = b;
            }
            tempCtx.putImageData(imgData, 0, 0);

            tCtx.save();
            tCtx.beginPath();
            tCtx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
            tCtx.clip();
            tCtx.drawImage(tempCanvas, x, y);
            tCtx.restore();

            tCtx.strokeStyle = "rgba(255,255,255,0.15)";
            tCtx.beginPath(); tCtx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2); tCtx.stroke();
        }

        // Отрисовка текста
        tCtx.fillStyle = "#dedede";
        tCtx.textAlign = "center";
        tCtx.font = "bold 24px 'Times New Roman', Georgia, serif";

        var lines = inputFio.toUpperCase().split(" ");
        var startY = 340;
        lines.forEach(function(line, index) {
            var spacedLine = line.split("").join(" ");
            tCtx.fillText(spacedLine, 256, startY + (index * 30));
        });

        tCtx.font = "bold 16px 'Times New Roman', Georgia, serif";
        tCtx.fillStyle = "#b8b8b8";
        tCtx.fillText(inputDates, 256, 470);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем сетку земли
        ctx.strokeStyle = '#2b2b2b';
        ctx.lineWidth = 1;
        for(var i = -4; i <= 4; i++) {
            var p1 = project({x: i*50, y: 110, z: -200}); var p2 = project({x: i*50, y: 110, z: 200});
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
            var p3 = project({x: -200, y: 110, z: i*50}); var p4 = project({x: 200, y: 110, z: i*50});
            ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
        }

        var pStele = steleBaseVertices.map(project);
        var pBase = baseVertices.map(project);

        // Сборка 3D полигонов
        var polygons = [
            // Тумба
            { pts: [pBase[0], pBase[1], pBase[2], pBase[3]], color: '#151515', front: false },
            { pts: [pBase[1], pBase[5], pBase[6], pBase[2]], color: '#252525', front: false },
            { pts: [pBase[5], pBase[4], pBase[7], pBase[6]], color: '#1a1a1a', front: false },
            { pts: [pBase[4], pBase[0], pBase[3], pBase[7]], color: '#0d0d0d', front: false },
            { pts: [pBase[3], pBase[2], pBase[6], pBase[7]], color: '#2a2a2a', front: false },
            // Стела
            { pts: [pStele[0], pStele[1], pStele[2], pStele[3]], color: '#1a1a1a', front: false }, // Задняя
            { pts: [pStele[1], pStele[5], pStele[6], pStele[2]], color: '#383838', front: false }, // Правая
            { pts: [pStele[5], pStele[4], pStele[7], pStele[6]], color: '#222222', front: false }, // Лицевая (под маску)
            { pts: [pStele[4], pStele[0], pStele[3], pStele[7]], color: '#151515', front: false }, // Левая
            { pts: [pStele[3], pStele[2], pStele[6], pStele[7]], color: '#454545', front: false }  // Верхний торец
        ];

        // Расчет глубины для сортировки (Z-буфер)
        polygons.forEach(function(poly) {
