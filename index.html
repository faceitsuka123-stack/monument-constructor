<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        #monument-assembly {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #stele {
            width: 300px;
            height: 480px;
            background: linear-gradient(135deg, #1c1c1c 0%, #0d0d0d 40%, #1c1c1c 50%, #080808 60%, #111111 100%);
            border-radius: 150px 150px 0 0;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 40px 15px 30px 15px;
            position: relative;
        }
        #stele::after {
            content: '';
            position: absolute;
            top: 0; left: 135px; width: 30px; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.05), rgba(255,255,255,0));
            pointer-events: none;
            z-index: 10;
        }
        #stone-base {
            width: 360px;
            height: 45px;
            background: linear-gradient(to bottom, #2a2a2a 0%, #151515 20%, #080808 100%);
            border: 2px solid #333;
            border-top: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            margin-top: -2px;
        }
        #portrait-wrapper {
            width: 140px;
            height: 180px;
            position: relative;
            overflow: hidden;
            margin-bottom: auto;
            display: none; 
            border-radius: 50%;
        }
        #portrait-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%) brightness(110%);
        }
        #portrait-fade {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(19,19,19,0) 25%, rgba(19,19,19,0.5) 60%, rgba(19,19,19,1) 98%);
        }
        #text-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: auto;
        }
        #display-fio {
            color: #dedede;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            line-height: 1.4;
            text-shadow: 1px 1px 1px #000, 1px 2px 0px #000;
            white-space: pre-line;
            font-family: 'Times New Roman', Georgia, serif;
            width: 100%;
        }
        #display-dates {
            color: #b8b8b8;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 1px #000;
            font-family: 'Times New Roman', Georgia, serif;
            width: 100%;
        }
        #sidebar-controls {
            flex: 1;
            min-width: 320px;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Онлайн-примерка гравировки на памятник</h1>

<div id="main-container">
    <div id="monument-preview-box">
        <div id="monument-assembly">
            <div id="stele">
                <div id="portrait-wrapper">
                    <img id="portrait-img" src="" alt="Портрет">
                    <div id="portrait-fade"></div>
                </div>
                <div id="text-block">
                    <div id="display-fio"></div>
                    <div id="display-dates"></div>
                </div>
            </div>
            <div id="stone-base"></div>
        </div>
    </div>
    
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">2. Выбор шрифта</span>
            <select id="font-selector">
                <option value="'Times New Roman', Georgia, serif">Академический (с засечками)</option>
                <option value="'Georgia', serif">Церковнославянский стиль</option>
                <option value="'Arial Black', sans-serif">Прямой рубленый (Строгий)</option>
                <option value="cursive, serif">Каллиграфический (Курсив)</option>
            </select>
        </div>

        <div class="input-group">
            <span class="section-title">3. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="hint-box">
            ⚙ Изменения текста и фотографий отображаются на памятнике мгновенно в реальном времени.
        </div>
    </div>
</div>

<script>
    var fileInput = document.getElementById('file-input');
    var portraitWrapper = document.getElementById('portrait-wrapper');
    var portraitImg = document.getElementById('portrait-img');
    
    var textFio = document.getElementById('text-fio');
    var textDates = document.getElementById('text-dates');
    
    var displayFio = document.getElementById('display-fio');
    var displayDates = document.getElementById('display-dates');
    var fontSelector = document.getElementById('font-selector');

    fileInput.onchange = function(event) {
        var reader = new FileReader();
        reader.onload = function(e) {
            portraitImg.src = e.target.result;
            portraitWrapper.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files);
    };

    textFio.oninput = function() {
        displayFio.innerHTML = textFio.value.toUpperCase().split(" ").join("<br>");
    };

    textDates.oninput = function() {
        displayDates.textContent = textDates.value;
    };

    fontSelector.onchange = function() {
        displayFio.style.fontFamily = fontSelector.value;
        displayDates.style.fontFamily = fontSelector.value;
    };
</script>

</body>
</html>
