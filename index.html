<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Конструктор Памятника</title>
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        #main-container {
            display: flex;
            gap: 20px;
            max-width: 1250px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        /* Большое 3D окно */
        #monument-preview-box {
            flex: 2;
            height: 650px;
            background-color: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #sidebar-controls {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #fafafa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .upload-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
        #file-input {
            display: none;
        }
        .hint-box {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            font-weight: bold;
        }
    </style>
    <!-- Подключаем официальные проверенные 3D скрипты Three.js -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<h1>Онлайн 3D-примерка гравировки на памятник</h1>

<div id="main-container">
    <!-- Окно 3D просмотра -->
    <div id="monument-preview-box">
        <div id="canvas-container"></div>
    </div>
    
    <!-- Панель управления -->
    <div id="sidebar-controls">
        <div class="input-group">
            <span class="section-title">1. Фотография</span>
            <label for="file-input" class="upload-btn">Загрузить портрет</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="input-group">
            <span class="section-title">2. Гравировка текста</span>
            <label>Фамилия Имя Отчество</label>
            <input type="text" id="text-fio" placeholder="Иванов Иван Иванович">
        </div>

        <div class="input-group">
            <label>Даты жизни</label>
            <input type="text" id="text-dates" placeholder="10.05.1950 — 22.11.2023">
        </div>

        <div class="hint-box">
            🔄 Зажмите левую кнопку мыши внутри 3D-окна и двигайте её, чтобы вращать памятник со всех сторон!
        </div>
    </div>
</div>

<script>
    var container = document.getElementById('canvas-container');
    var wrapper = document.getElementById('monument-preview-box');
    
    // Переменные данных пользователя
    var inputFio = "";
    var inputDates = "";
    var userImage = null;

    // Инициализация 3D сцены
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    // Камера
    var camera = new THREE.PerspectiveCamera(45, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 6);

    // Рендерер
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Управление вращением OrbitControls
    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Запрет уходить под землю
    controls.minDistance = 3;
    controls.maxDistance = 8;
    controls.target.set(0, 1.2, 0);

    // Свет
    var ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Земля (подложка под памятником)
    var floorGeo = new THREE.PlaneGeometry(20, 20);
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    var floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Создаем виртуальный холст (текстуру) для лица памятника
    var textureCanvas = document.createElement('canvas');
    var tCtx = textureCanvas.getContext('2d');
    textureCanvas.width = 512;
    textureCanvas.height = 512;

    var steleTexture = new THREE.CanvasTexture(textureCanvas);

    // Базовый материал полированного черного гранита
    var graniteMaterial = new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.1,
        metalness: 0.1
    });

    // Материал для лицевой грани (куда идет наша динамическая текстура)
    var faceMaterial = new THREE.MeshStandardMaterial({
        map: steleTexture,
        roughness: 0.15,
        metalness: 0.05
    });

    // Накладываем материалы на 6 граней стелы [право, лево, верх, низ, лицо, зад]
    var steleMaterials = [
        graniteMaterial, graniteMaterial, graniteMaterial, graniteMaterial, faceMaterial, graniteMaterial
    ];

    // Геометрия и создание 3D Стелы (ширина: 1.2, высота: 2.1, толщина: 0.25)
    var steleGeo = new THREE.BoxGeometry(1.2, 2.1, 0.25);
    var stele = new THREE.Mesh(steleGeo, steleMaterials);
    stele.position.y = 1.25;
    stele.castShadow = true;
    scene.add(stele);

    // Создание 3D Тумбы-основания
    var baseGeo = new THREE.BoxGeometry(1.6, 0.2, 0.5);
    var base = new THREE.Mesh(baseGeo, graniteMaterial);
    base.position.y = 0.1;
    base.castShadow = true;
    base.receiveShadow = true;
    scene.add(base);

    // Функция генерации текстуры (Фото + Текст)
    function updateMonumentTexture() {
        // Заливка плиты цветом камня габбро
        tCtx.fillStyle = "#161616";
        tCtx.fillRect(0, 0, 512, 512);

        // 1. Рисуем портрет с эффектом гравировки и растушевки
        if (userImage) {
            var aspect = userImage.width / userImage.height;
            var w = 220;
            var h = w / aspect;
            if (h > 260) { h = 260; w = h * aspect; }
            
            var x = (512 - w) / 2;
            var y = 40;

            // Временный холст для наложения ЧБ-фильтра
            var tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            var tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(userImage, 0, 0, w, h);

            // Алгоритм лазерного скола
            var imgData = tempCtx.getImageData(0, 0, w, h);
            var data = imgData.data;
            for (var i = 0; i < data.length; i += 4) {
                var b = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                b = b > 120 ? Math.min(255, b * 1.4) : Math.max(40, b * 0.35);
                data[i] = b; data[i + 1] = b; data[i + 2] = b;
            }
            tempCtx.putImageData(imgData, 0, 0);

            // Радиальная растушевка краев портрета в овал
            tCtx.save();
            tCtx.beginPath();
            tCtx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
            tCtx.clip();
            tCtx.drawImage(tempCanvas, x, y);
            tCtx.restore();

            // Мягкая контурная рамка овала
            tCtx.strokeStyle = "rgba(255,255,255,0.15)";
            tCtx.lineWidth = 2;
            tCtx.beginPath();
            tCtx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
            tCtx.stroke();
        }

        // 2. Наносим текст гравировки (ФИО и Даты) строго под фото
        tCtx.fillStyle = "#dedede";
        tCtx.textAlign = "center";
        tCtx.font = "bold 22px 'Times New Roman', Georgia, serif";

        var lines = inputFio.toUpperCase().split(" ");
        var startY = 340;
        lines.forEach(function(line, index) {
            var spacedLine = line.split("").join(" ");
            tCtx.fillText(spacedLine, 256, startY + (index * 28));
        });

        // Даты жизни
        tCtx.font = "bold 16px 'Times New Roman', Georgia, serif";
        tCtx.fillStyle = "#b8b8b8";
